<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#03070a" />
<title>ASTRA — Contact Us</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--black);
    color: var(--frost);
    font-family: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* Starfield */
  .stars, .stars::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      radial-gradient(1.4px 1.4px at 20% 30%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 72% 12%, #fff, transparent),
      radial-gradient(1px 1px at 48% 62%, #cfe0ee, transparent),
      radial-gradient(1.6px 1.6px at 88% 76%, #fff, transparent),
      radial-gradient(1px 1px at 8% 82%, #cfe0ee, transparent),
      radial-gradient(1.2px 1.2px at 60% 88%, #fff, transparent),
      radial-gradient(1px 1px at 35% 8%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 92% 40%, #cfe0ee, transparent),
      radial-gradient(1px 1px at 15% 55%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 58%, #fff, transparent);
    background-repeat: repeat;
    background-size: 340px 340px;
    opacity: .55;
  }
  .glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(640px circle at 50% -6%, rgba(87,149,245,.2), transparent 60%),
      radial-gradient(480px circle at 100% 100%, rgba(87,149,245,.1), transparent 55%);
    pointer-events: none;
  }

  main.card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .badge {
    display: grid;
    place-items: center;
    margin-bottom: 30px;
  }
  .badge img { width: 220px; max-width: 70vw; height: auto; object-fit: contain; filter: drop-shadow(0 0 22px rgba(87,149,245,.35)); }

  h1 {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .18em;
    text-align: center;
    margin: 0 0 4px;
    color: var(--frost);
  }
  p.sub {
    text-align: center;
    color: var(--platinum);
    font: 12px/1 var(--mono);
    letter-spacing: .1em;
    margin: 0 0 30px;
  }

  form { width: 100%; }
  .field-wrap { position: relative; margin-bottom: 14px; }
  .field-wrap svg {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 17px;
    height: 17px;
    color: #6b7680;
    pointer-events: none;
  }
  .field-wrap.textarea-wrap svg {
    top: 24px;
  }
  input[type="text"], input[type="email"], input[type="tel"], textarea {
    width: 100%;
    padding: 0 18px 0 48px;
    border-radius: 20px;
    border: none;
    background: #eef2f5;
    color: #0d1620;
    font: 15px/1.5 var(--text);
    outline: none;
    box-shadow: 0 1px 0 rgba(255,255,255,.5) inset;
    transition: box-shadow .15s var(--ease), transform .1s var(--ease);
  }
  input[type="text"], input[type="email"], input[type="tel"] {
    height: 52px;
    border-radius: 999px;
  }
  textarea {
    height: 120px;
    padding-top: 16px;
    padding-bottom: 16px;
    resize: vertical;
  }
  input::placeholder, textarea::placeholder { color: #7b8791; }
  input[type="text"]:focus, input[type="email"]:focus, input[type="tel"]:focus, textarea:focus {
    box-shadow: 0 0 0 3px rgba(87,149,245,.45);
  }

  .submit {
    width: 100%;
    height: 52px;
    margin-top: 10px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(180deg, #6ba2f7, #2f5fc9);
    color: #fff;
    font: 15px/1 var(--text);
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(47,95,201,.4);
    transition: filter .15s var(--ease), transform .1s var(--ease);
  }
  .submit:disabled { opacity: .65; cursor: progress; }
  .submit:not(:disabled):hover { filter: brightness(1.08); }
  .submit:not(:disabled):active { transform: translateY(1px); }

  .success {
    display: none;
    margin-top: 16px;
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(87,149,245,.4);
    background: rgba(87,149,245,.12);
    color: #96c0fb;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
  }
  .success.is-visible { display: block; }

  .links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    margin-top: 26px;
    font-size: 13px;
  }
  .links a { color: var(--silver); text-decoration: none; }
  .links a:hover { color: #fff; }

  .contact-details {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,.1);
    width: 100%;
    text-align: center;
  }
  .contact-details h3 {
    font-size: 11px;
    letter-spacing: .15em;
    color: var(--silver);
    margin: 0 0 8px;
    font-weight: 600;
  }
  .contact-details p {
    font-size: 13px;
    color: var(--platinum);
    line-height: 1.6;
    margin: 0;
  }

  @media (max-width: 420px) {
    .badge img { width: 170px; }
  }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main class="card">
    <div class="badge"><img src="assets/brand/astra-logo-navigation.png" alt="ASTRA" /></div>
    <h1>ASTRA INQUIRY</h1>
    <p class="sub">Contact our team</p>

    <form id="contactForm" autocomplete="off">
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="name" name="name" placeholder="Name" required />
      </div>
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <input type="tel" id="contactNo" name="contactNo" placeholder="Contact no." required />
      </div>
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" id="email" name="email" placeholder="Email address" required />
      </div>
      <div class="field-wrap textarea-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <textarea id="query" name="query" placeholder="How can we help you?" required></textarea>
      </div>
      <button type="submit" class="submit" id="submitBtn">Send message</button>
      <div class="success" id="contactSuccess">Message received. We'll be in touch shortly.</div>
    </form>

    <div class="links">
      <a href="index.html">← Back to overview</a>
    </div>

    <div class="contact-details">
      <h3>ASTRA HEADQUARTERS</h3>
      <p>contact@astra-space.com<br />+1 (800) 555-0199</p>
    </div>
  </main>

<script>
(() => {
  "use strict";
  const form = document.getElementById("contactForm");
  const successBox = document.getElementById("contactSuccess");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    successBox.classList.remove("is-visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    // Simulate network request
    setTimeout(() => {
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = "Send message";
      successBox.classList.add("is-visible");
    }, 1200);
  });
})();
</script>
</body>
</html>
