<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#03070a" />
<meta name="description" content="Contact the ASTRA team." />
<title>ASTRA — Contact</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--black);
    color: var(--frost);
    font-family: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 24px;
    position: relative;
    overflow-x: hidden;
  }

  .stars, .stars::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      radial-gradient(1.4px 1.4px at 20% 30%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 72% 12%, #fff, transparent),
      radial-gradient(1px 1px at 48% 62%, #cfe0ee, transparent),
      radial-gradient(1.6px 1.6px at 88% 76%, #fff, transparent),
      radial-gradient(1px 1px at 8% 82%, #cfe0ee, transparent),
      radial-gradient(1.2px 1.2px at 60% 88%, #fff, transparent),
      radial-gradient(1px 1px at 35% 8%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 92% 40%, #cfe0ee, transparent),
      radial-gradient(1px 1px at 15% 55%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 58%, #fff, transparent);
    background-repeat: repeat;
    background-size: 340px 340px;
    opacity: .55;
  }
  .glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(640px circle at 50% -6%, rgba(87,149,245,.2), transparent 60%),
      radial-gradient(480px circle at 100% 100%, rgba(87,149,245,.1), transparent 55%);
    pointer-events: none;
  }

  main.card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .badge { display: grid; place-items: center; margin-bottom: 22px; }
  .badge img { width: 220px; max-width: 70vw; height: auto; object-fit: contain; filter: drop-shadow(0 0 22px rgba(87,149,245,.35)); }

  h1 {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .18em;
    text-align: center;
    margin: 0 0 4px;
    color: var(--frost);
  }
  p.sub {
    text-align: center;
    color: var(--platinum);
    font: 12px/1 var(--mono);
    letter-spacing: .1em;
    margin: 0 0 26px;
  }

  form { width: 100%; }
  .field-wrap { position: relative; margin-bottom: 14px; }
  .field-wrap svg {
    position: absolute;
    left: 18px;
    top: 24px;
    width: 17px;
    height: 17px;
    color: #6b7680;
    pointer-events: none;
  }
  .field-wrap textarea + svg { top: 20px; }

  input[type="text"], input[type="email"], input[type="tel"] {
    width: 100%;
    height: 52px;
    padding: 0 18px 0 48px;
    border-radius: 999px;
    border: none;
    background: #eef2f5;
    color: #0d1620;
    font: 15px/1 var(--text);
    outline: none;
    box-shadow: 0 1px 0 rgba(255,255,255,.5) inset;
    transition: box-shadow .15s var(--ease);
  }
  textarea {
    width: 100%;
    min-height: 108px;
    max-height: 260px;
    padding: 16px 18px 16px 48px;
    border-radius: 22px;
    border: none;
    background: #eef2f5;
    color: #0d1620;
    font: 15px/1.5 var(--text);
    outline: none;
    resize: vertical;
    box-shadow: 0 1px 0 rgba(255,255,255,.5) inset;
    transition: box-shadow .15s var(--ease);
  }
  input::placeholder, textarea::placeholder { color: #7b8791; }
  input:focus, textarea:focus { box-shadow: 0 0 0 3px rgba(15,23,42,.55); }

  .submit {
    width: 100%;
    height: 52px;
    margin-top: 10px;
    border: none;
    border-radius: 999px;
    background: var(--frost);
    color: #04070a;
    font: 15px/1 var(--text);
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,.4);
    transition: background .15s var(--ease), transform .1s var(--ease);
  }
  .submit:disabled { opacity: .65; cursor: progress; }
  .submit:not(:disabled):hover { background: #fff; }
  .submit:not(:disabled):active { transform: translateY(1px); }

  .status {
    display: none;
    margin-top: 16px;
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
  }
  .status.is-visible { display: block; }
  .status.is-error { border: 1px solid rgba(229,106,114,.4); background: rgba(229,106,114,.12); color: #f0989e; }
  .status.is-ok { border: 1px solid rgba(87,149,245,.4); background: rgba(87,149,245,.12); color: #a9c6f5; }

  .links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    margin-top: 26px;
    font-size: 13px;
  }
  .links a { color: var(--silver); text-decoration: none; }
  .links a:hover { color: #fff; }

  .hq {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    margin-top: 44px;
    padding-top: 28px;
    border-top: 1px solid var(--line-strong);
    text-align: center;
  }
  .hq h2 {
    font-family: var(--display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .18em;
    color: var(--platinum);
    margin: 0 0 14px;
  }
  .hq dl {
    display: grid;
    gap: 8px;
    margin: 0;
    font-size: 13px;
    color: var(--silver);
  }
  .hq dt { display: inline; font-weight: 600; color: var(--frost); }
  .hq dd { display: inline; margin: 0 0 0 6px; }
  .hq a { color: inherit; text-decoration: none; }
  .hq a:hover { color: #fff; }

  @media (max-width: 420px) {
    .badge img { width: 170px; }
  }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main class="card">
    <div class="badge"><img src="assets/brand/astra-logo-navigation.png" alt="ASTRA" /></div>
    <h1>ASTRA INQUIRY</h1>
    <p class="sub">Contact our team</p>

    <form id="contactForm" autocomplete="on">
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke-linecap="round"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="name" name="name" autocomplete="name" placeholder="Name" required />
      </div>
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.9 21 3 12.1 3 1c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1L6.6 10.8z"/></svg>
        <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="Contact no." />
      </div>
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="Email address" required />
      </div>
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <textarea id="message" name="message" placeholder="How can we help you?" required></textarea>
      </div>
      <button type="submit" class="submit" id="submitBtn">Send message</button>
      <div class="status" id="formStatus"></div>
    </form>

    <div class="links">
      <a href="index.html">← Back to overview</a>
    </div>
  </main>

  <div class="hq">
    <h2>ASTRA HEADQUARTERS</h2>
    <dl>
      <div><dt>Email</dt><dd><a href="mailto:contact@astra-project.dev">contact@astra-project.dev</a></dd></div>
      <div><dt>Mission control</dt><dd><a href="login.html">Sign in to the console</a></dd></div>
      <div><dt>Response time</dt><dd>A few business days — academic prototype</dd></div>
    </dl>
  </div>

<script>
(() => {
  "use strict";
  const form = document.getElementById("contactForm");
  const statusBox = document.getElementById("formStatus");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    statusBox.classList.remove("is-visible", "is-error", "is-ok");

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!name || !email || !message) {
      statusBox.textContent = "Please fill in your name, email and message.";
      statusBox.classList.add("is-visible", "is-error");
      return;
    }

    const subject = `ASTRA inquiry from ${name}`;
    const bodyLines = [message, "", `Name: ${name}`, `Email: ${email}`];
    if (phone) bodyLines.push(`Phone: ${phone}`);
    const mailto = `mailto:contact@astra-project.dev?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyLines.join("\n"))}`;

    submitBtn.disabled = true;
    submitBtn.textContent = "Opening email…";
    window.location.href = mailto;

    statusBox.textContent = "Your email app should now open with the message pre-filled.";
    statusBox.classList.add("is-visible", "is-ok");
    window.setTimeout(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send message";
    }, 1500);
  });
})();
</script>
</body>
</html>
