<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1080" viewBox="0 0 320 90" fill="none" role="img" aria-labelledby="astra-logo-title astra-logo-description">
  <title id="astra-logo-title">ASTRA</title>
  <desc id="astra-logo-description">ASTRA folded orbital A symbol and wordmark</desc>

  <defs>
    <linearGradient id="astra-left" x1="39" y1="10" x2="9" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7D4D8"/>
      <stop offset=".45" stop-color="#82B1FA"/>
      <stop offset="1" stop-color="#315FB8"/>
    </linearGradient>
    <linearGradient id="astra-right" x1="41" y1="9" x2="72" y2="75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A1C7FF"/>
      <stop offset=".52" stop-color="#6198F2"/>
      <stop offset="1" stop-color="#315FB8"/>
    </linearGradient>
    <linearGradient id="astra-fold" x1="24" y1="66" x2="57" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4BAEBA"/>
      <stop offset=".58" stop-color="#93DCE1"/>
      <stop offset="1" stop-color="#6198F2"/>
    </linearGradient>
  </defs>

  <!-- Three engineered planes form an A around a precise orbital void. -->
  <g shape-rendering="geometricPrecision">
    <path d="M40.2 8L5.5 76.5L23.4 69.2L43.4 24.7L40.2 8Z" fill="url(#astra-left)"/>
    <path d="M40.2 8L75 76.5L56.5 68.8L43.4 24.7L40.2 8Z" fill="url(#astra-right)"/>
    <path d="M23.4 69.2L33.1 51.8L47.1 51.8L56.5 68.8L42.1 61.9L37.7 61.9L23.4 69.2Z" fill="url(#astra-fold)"/>
    <path d="M40.2 8L43.4 24.7L41.1 29.8L38.9 24.7L40.2 8Z" fill="#DCE6E8" fill-opacity=".72"/>
  </g>

  <!-- Navigation-scale wordmark. -->
  <text x="101" y="56.5" fill="#DCE6E8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27.5" font-weight="500" letter-spacing="12.5">ASTRA</text>
</svg>
